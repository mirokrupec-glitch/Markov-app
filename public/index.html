<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markov Quant</title>
  /style.css?v=20260522
</head>

<body>

<h2>📊 MARKOV QUANT TERMINAL</h2>

<div class="topbar">
  <input id="ticker" value="AAPL" autocomplete="off">
  <button id="runBtn" type="button">RUN</button>
</div>

<div id="out"></div>

<script>
const STATES = ["Strong Bear", "Bear", "Neutral", "Bull", "Strong Bull"];

function esc(value){
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function buildClassifier(ret){
  const sorted = [...ret].sort((a,b)=>a-b);

  const q15 = sorted[Math.floor(sorted.length * 0.15)];
  const q40 = sorted[Math.floor(sorted.length * 0.40)];
  const q60 = sorted[Math.floor(sorted.length * 0.60)];
  const q85 = sorted[Math.floor(sorted.length * 0.85)];

  return function(r){
    if(r < q15) return 0;
    if(r < q40) return 1;
    if(r < q60) return 2;
    if(r < q85) return 3;
    return 4;
  };
}

function buildMatrix(seq){
  const m = Array.from({length:5}, () => Array(5).fill(0));

  for(let i=0; i<seq.length-1; i++){
    m[seq[i]][seq[i+1]]++;
  }

  return m.map(r => {
    const s = r.reduce((a,b)=>a+b,0);
    return s ? r.map(v=>v/s) : Array(5).fill(0.2);
  });
}

function monte(avg, vol, days){
  const r = [];

  for(let i=0; i<500; i++){
    let val = 0;

    for(let d=0; d<days; d++){
      val += avg + vol * (Math.random() - 0.5) * 2;
    }

    r.push(val);
  }

  r.sort((a,b)=>a-b);

  return {
    worst: r[Math.floor(r.length * 0.05)],
    median: r[Math.floor(r.length * 0.50)],
    best: r[Math.floor(r.length * 0.95)]
  };
}

function drawChart(canvas, prices){
  if(!canvas) return;

  const ctx = canvas.getContext("2d");
  const w = canvas.width = canvas.clientWidth;
  const h = canvas.height = canvas.clientHeight;

  ctx.clearRect(0,0,w,h);

  const clean = prices.filter(v => typeof v === "number" && isFinite(v));

  if(clean.length < 2){
    ctx.fillStyle = "#888";
    ctx.fillText("No chart data", 10, 20);
    return;
  }

  const min = Math.min(...clean);
  const max = Math.max(...clean);
  const range = max - min || 1;

  ctx.beginPath();
  ctx.strokeStyle = "#22c55e";
  ctx.lineWidth = 2;

  clean.forEach((p,i)=>{
    const x = i / (clean.length - 1) * w;
    const y = h - ((p - min) / range) * h;

    if(i === 0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  });

  ctx.stroke();
}

function colorState(state){
  if(state.includes("Bull")) return `<span class="green">${state}</span>`;
  if(state.includes("Bear")) return `<span class="red">${state}</span>`;
  return `<span class="yellow">${state}</span>`;
}

function colorSignal(signal){
  if(signal === "BUY") return `<span class="green">BUY</span>`;
  if(signal === "SELL") return `<span class="red">SELL</span>`;
  return `<span class="yellow">NEUTRAL</span>`;
}

function getTrend(close, days){
  if(close.length <= days) return 0;

  const now = close[close.length - 1];
  const past = close[close.length - 1 - days];

  if(!past) return 0;

  return (now - past) / past;
}

function trendLabel(value){
  if(value > 0.03) return `<span class="green">Bullish</span>`;
  if(value < -0.03) return `<span class="red">Bearish</span>`;
  return `<span class="yellow">Neutral</span>`;
}

async function run(){
  const tickerInput = document.getElementById("ticker");
  const out = document.getElementById("out");
  const runBtn = document.getElementById("runBtn");

  const t = tickerInput.value.trim().toUpperCase();

  if(!t){
    out.innerHTML = "❌ Enter ticker";
    return;
  }

  runBtn.disabled = true;
  runBtn.textContent = "LOADING...";
  out.innerHTML = "Loading...";

  try{
    const res = await fetch("/api/data?t=" + encodeURIComponent(t) + "&_=" + Date.now());
    const data = await res.json();

    if(!res.ok || data.error){
      out.innerHTML = "❌ Data error";
      return;
    }

    const close = (data.close || []).filter(v => typeof v === "number" && isFinite(v));
    const name = esc(data.name || t);
    const exchange = esc(data.exchange || "Unknown");

    if(close.length < 40){
      out.innerHTML = "❌ Not enough price data";
      return;
    }

    const ret = [];

    for(let i=1; i<close.length; i++){
      if(close[i] && close[i-1]){
        ret.push((close[i] - close[i-1]) / close[i-1]);
      }
    }

    if(ret.length < 30){
      out.innerHTML = "❌ Not enough return data";
      return;
    }

    const classify = buildClassifier(ret);
    const seq = ret.map(classify);
    const P = buildMatrix(seq);

    const recent = seq.slice(-20);
    const avgState = recent.reduce((a,b)=>a+b,0) / recent.length;
    const current = Math.max(0, Math.min(4, Math.round(avgState)));

    const avg = ret.reduce((a,b)=>a+b,0) / ret.length;

    const vol = Math.sqrt(
      ret.reduce((a,b)=>a + Math.pow(b - avg, 2), 0) / ret.length
    );

    const crash = ret.filter(x => x < -0.02).length / ret.length;

    const mc30 = monte(avg, vol, 30);
    const mc90 = monte(avg, vol, 90);
    const mc252 = monte(avg, vol, 252);

    const row = P[current];

    const down = row[0] + row[1];
    const neutral = row[2];
    const up = row[3] + row[4];

    const trend20 = getTrend(close, 20);
    const trend60 = getTrend(close, 60);

    let markovSignal = "NEUTRAL";

    if(up > down && up > 0.52) markovSignal = "BUY";
    if(down > up && down > 0.52) markovSignal = "SELL";

    const markovConfidence = Math.max(up, down, neutral);
    const markovSignalHTML = colorSignal(markovSignal);

    let score = 0;

    score += (up - down) * 2;
    score += (current - 2) * 0.35;

    let trendScore = 0;

    if(trend20 > 0.03) trendScore += 0.7;
    else if(trend20 > 0.01) trendScore += 0.35;
    else if(trend20 < -0.03) trendScore -= 0.7;
    else if(trend20 < -0.01) trendScore -= 0.35;

    if(trend60 > 0.06) trendScore += 0.7;
    else if(trend60 > 0.02) trendScore += 0.35;
    else if(trend60 < -0.06) trendScore -= 0.7;
    else if(trend60 < -0.02) trendScore -= 0.35;

    score += trendScore;

    if(crash > 0.12) score -= 0.5;
    if(vol > 0.035) score -= 0.3;

    let finalSignal = "NEUTRAL";

    if(score > 0.75) finalSignal = "BUY";
    if(score < -0.75) finalSignal = "SELL";

    out.innerHTML = `
      <div class="card">
        <h3>${name} <span class="muted">(${exchange})</span></h3>

        <canvas id="chart"></canvas>

        <div class="grid">
          <div>
            <div class="label">Current State</div>
            <div class="value">${colorState(STATES[current])}</div>
          </div>

          <div>
            <div class="label">Markov Signal</div>
            <div class="value">${markovSignalHTML}</div>
          </div>

          <div>
            <div class="label">Final Signal</div>
            <div class="value">${colorSignal(finalSignal)}</div>
          </div>

          <div>
            <div class="label">Confidence</div>
            <div class="value">${(markovConfidence * 100).toFixed(1)}%</div>
          </div>
        </div>

        <h4>Transition Probabilities</h4>

        <div class="probs">
          <div>Down: <span class="red">${(down * 100).toFixed(1)}%</span></div>
          <div>Neutral: <span class="yellow">${(neutral * 100).toFixed(1)}%</span></div>
          <div>Up: <span class="green">${(up * 100).toFixed(1)}%</span></div>
        </div>

        <h4>Trend</h4>

        <div class="probs">
          <div>20D: ${trendLabel(trend20)} ${(trend20 * 100).toFixed(2)}%</div>
          <div>60D: ${trendLabel(trend60)} ${(trend60 * 100).toFixed(2)}%</div>
          <div>Volatility: <span class="yellow">${(vol * 100).toFixed(2)}%</span></div>
        </div>

        <h4>Monte Carlo</h4>

        <div class="grid">
          <div>
            <div class="label">30D Worst / Median / Best</div>
            <div class="value">
              ${(mc30.worst * 100).toFixed(2)}% /
              ${(mc30.median * 100).toFixed(2)}% /
              ${(mc30.best * 100).toFixed(2)}%
            </div>
          </div>

          <div>
            <div class="label">90D Worst / Median / Best</div>
            <div class="value">
              ${(mc90.worst * 100).toFixed(2)}% /
              ${(mc90.median * 100).toFixed(2)}% /
              ${(mc90.best * 100).toFixed(2)}%
            </div>
          </div>

          <div>
            <div class="label">252D Worst / Median / Best</div>
            <div class="value">
              ${(mc252.worst * 100).toFixed(2)}% /
              ${(mc252.median * 100).toFixed(2)}% /
              ${(mc252.best * 100).toFixed(2)}%
            </div>
          </div>

          <div>
            <div class="label">Crash Frequency</div>
            <div class="value">${(crash * 100).toFixed(1)}%</div>
          </div>
        </div>
      </div>
    `;

    drawChart(document.getElementById("chart"), close);

  }catch(e){
    console.error(e);
    out.innerHTML = "❌ Request failed";
  }finally{
    runBtn.disabled = false;
    runBtn.textContent = "RUN";
  }
}

document.getElementById("runBtn").addEventListener("click", run);

document.getElementById("ticker").addEventListener("keydown", function(e){
  if(e.key === "Enter") run();
});

run();
</script>

</body>
</html>
