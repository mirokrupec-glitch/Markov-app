<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width">
<title>Markov Live</title>

<style>
body { background:#0d1117; color:white; font-family:monospace; padding:15px; }
input,button { padding:10px; margin:5px; }
.bar { width:2px; background:#22c55e; }
</style>
</head>

<body>

<h2>📊 MARKOV LIVE</h2>

<input id="ticker" value="AAPL">
<button onclick="run()">RUN</button>

<div id="out"></div>

<script>
async function run(){
  const out=document.getElementById("out");
  const t=document.getElementById("ticker").value;

  out.innerHTML="Loading...";

  try{
    const res = await fetch("/api/data?t="+t);
    const close = await res.json();

    let ret=[];
    for(let i=1;i<close.length;i++){
      ret.push((close[i]-close[i-1])/close[i-1]);
    }

    let avg = ret.reduce((a,b)=>a+b,0)/ret.length;
    let crash = ret.filter(r=>r<-0.02).length/ret.length;

    let signal = avg>0.001?"🟢 BUY":avg<-0.001?"🔴 SELL":"⚪ NEUTRAL";

    let graph="<div style='display:flex'>";
    close.slice(-100).forEach(p=>{
      graph+=`<div class="bar" style="height:${p*0.4}px"></div>`;
    });
    graph+="</div>";

    out.innerHTML = "<h3>"+signal+"</h3><p>Crash: "+(crash*100).toFixed(1)+"%</p>"+graph;

  }catch(e){
    out.innerHTML="❌ error";
  }
}
</script>

</body>
</html>
