<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width">
<title>Markov Quant</title>

<style>
body { background:#0d1117; color:white; font-family:monospace; padding:15px; }
input,button { padding:10px; margin:5px; }
.bar { width:2px; background:#22c55e; }
.grid { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; }
.cell { padding:6px; text-align:center; font-size:12px; }
.box { margin-top:10px; padding:10px; border:1px solid #333; }
.title { color:#f59e0b; }
</style>

</head>

<body>

<h2>📊 MARKOV QUANT TERMINAL</h2>

<input id="ticker" value="AAPL">
<button onclick="run()">RUN</button>

<div id="out"></div>

<script>

const STATES = [
  "Strong Bear",
  "Bear",
  "Neutral",
  "Bull",
  "Strong Bull"
];

const TH = [-0.015, -0.003, 0.003, 0.015];

function classify(r){
  if(r < TH[0]) return 0;
  if(r < TH[1]) return 1;
  if(r < TH[2]) return 2;
  if(r < TH[3]) return 3;
  return 4;
}

function buildMatrix(seq){
  let m = Array.from({length:5},()=>Array(5).fill(0));

  for(let i=0;i<seq.length-1;i++){
    m[seq[i]][seq[i+1]]++;
  }

  return m.map(row=>{
    let s=row.reduce((a,b)=>a+b,0);
    return s ? row.map(v=>v/s) : Array(5).fill(0.2);
  });
}

function monte(avg, vol, days){
  if(!isFinite(avg)||!isFinite(vol)) return {worst:0, median:0, best:0};

  let r=[];
  for(let i=0;i<1000;i++){
    let val=0;
    for(let d=0;d<days;d++){
      let x = avg + vol * (Math.random()-0.5)*2;
      val += x;
    }
    r.push(val);
  }
  r.sort((a,b)=>a-b);

  return {
    worst: r[Math.floor(r.length*0.05)],
    median: r[Math.floor(r.length*0.5)],
    best: r[Math.floor(r.length*0.95)]
  };
}

async function run(){

  const t = document.getElementById("ticker").value;
  const out = document.getElementById("out");

  out.innerHTML="Loading...";

  try{
    // ✅ cache bypass
    const res = await fetch("/api/data?t="+t+"&_="+Date.now());
    const close = await res.json();

    let ret=[];
    for(let i=1;i<close.length;i++){
      if(close[i] && close[i-1]){
        ret.push((close[i]-close[i-1])/close[i-1]);
      }
    }

    if(ret.length < 10){
      out.innerHTML="❌ málo dát";
      return;
    }

    const seq = ret.map(classify);
    const P = buildMatrix(seq);
    const current = seq[seq.length-1];

    let avg = ret.reduce((a,b)=>a+b,0)/ret.length;

    let vol = Math.sqrt(
      ret.reduce((a,b)=>a+b*b,0)/ret.length
    );

    let crash = ret.filter(x=>x<-0.02).length / ret.length;

    const mc30 = monte(avg,vol,30);

    let signal="NEUTRAL";
    if(current>=3 && avg>0) signal="BULLISH";
    if(current<=1 && avg<0) signal="BEARISH";

    let graph="<div style='display:flex'>";
    close.slice(-100).forEach(p=>{
      graph+=`<div class="bar" style="height:${p*0.4}px"></div>`;
    });
    graph+="</div>";

    let matrixHTML="<div class='grid'>";
    P.forEach(row=>{
      row.forEach(v=>{
        matrixHTML+=`<div class="cell">${(v*100).toFixed(0)}%</div>`;
      });
    });
    matrixHTML+="</div>";

    out.innerHTML=`
      <div class="box">
        <div class="title">State</div>
        ${STATES[current]}
      </div>

      <div class="box">
        <div class="title">Signal</div>
        ${signal}
      </div>

      <div class="box">
        <div class="title">Crash risk</div>
        ${(crash*100).toFixed(1)}%
      </div>

      <div class="box">
        <div class="title">Monte Carlo 30d</div>
        ${mc30.worst.toFixed(2)} → ${mc30.median.toFixed(2)} → ${mc30.best.toFixed(2)}
      </div>

      <div class="box">
        ${matrixHTML}
      </div>

      <div class="box">
        ${graph}
      </div>
    `;

  }catch(e){
    out.innerHTML="❌ error";
  }
}

</script>

</body>
</html>
