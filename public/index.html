<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width">
<title>Markov Live</title>

<style>
body { background:#0d1117; color:white; font-family:monospace; padding:15px; }
input,button { padding:10px; margin:5px; }
.bar { width:2px; background:#22c55e; }
.grid { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; }
.cell { padding:6px; text-align:center; font-size:12px; }
</style>
</head>

<body>

<h2>📊 MARKOV ANALYZER</h2>

<input id="ticker" value="AAPL">
<button onclick="run()">RUN</button>

<div id="out"></div>

<script>

// --- STATES ---
const STATES = ["SBR","BER","NEU","BUL","SBL"];
const TH = [-0.015, -0.003, 0.003, 0.015];

// --- CLASSIFY ---
function classify(r){
  if(r < TH[0]) return 0;
  if(r < TH[1]) return 1;
  if(r < TH[2]) return 2;
  if(r < TH[3]) return 3;
  return 4;
}

// --- MATRIX ---
function buildMatrix(seq){
  let n=5;
  let m = Array.from({length:n},()=>Array(n).fill(0));

  for(let i=0;i<seq.length-1;i++){
    m[seq[i]][seq[i+1]]++;
  }

  return m.map(row=>{
    let s=row.reduce((a,b)=>a+b,0);
    return s ? row.map(v=>v/s) : Array(n).fill(0.2);
  });
}

// --- RUN ---
async function run(){

  const out = document.getElementById("out");
  const t = document.getElementById("ticker").value;

  out.innerHTML = "⏳ Loading...";

  try{
    const res = await fetch("/api/data?t="+t);
    const close = await res.json();

    // RETURNS
    let returns=[];
    for(let i=1;i<close.length;i++){
      returns.push((close[i]-close[i-1])/close[i-1]);
    }

    // STATES
    const seq = returns.map(classify);
    const P = buildMatrix(seq);

    const current = seq[seq.length-1];

    // SIGNAL
    let avg = returns.reduce((a,b)=>a+b,0)/returns.length;

    let signal =
      avg>0.001?"🟢 BUY":
      avg<-0.001?"🔴 SELL":
      "⚪ NEUTRAL";

    // GRAPH
    let graph="<div style='display:flex'>";
    close.slice(-100).forEach(p=>{
      graph+=`<div class="bar" style="height:${p*0.4}px"></div>`;
    });
    graph+="</div>";

    // MATRIX HTML
    let matrixHTML="<div class='grid'>";
    P.forEach(row=>{
      row.forEach(v=>{
        matrixHTML+=`
          <div class="cell" style="background:rgba(245,158,11,${v})">
            ${(v*100).toFixed(0)}%
          </div>
        `;
      });
    });
    matrixHTML+="</div>";

    out.innerHTML = `
      <h3>${signal} | STATE: ${STATES[current]}</h3>
      
      <h4>📊 Transition Matrix</h4>
      ${matrixHTML}

      <h4>📈 Price</h4>
      ${graph}
    `;

  }catch(e){
    out.innerHTML="❌ Error";
  }
}

</script>

</body>
</html>
