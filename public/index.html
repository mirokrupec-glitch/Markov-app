<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width">
<title>Markov Quant PRO</title>

<style>
body { background:#0d1117; color:white; font-family:monospace; padding:15px; }
input,button { padding:10px; margin:5px; }
.bar { width:2px; background:#22c55e; }
.grid { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; margin-top:10px; }
.cell { padding:6px; text-align:center; font-size:12px; }
</style>
</head>

<body>

<h2>📊 MARKOV QUANT PRO</h2>

<input id="ticker" value="AAPL">
<button onclick="run()">RUN</button>

<div id="out"></div>

<script>

const TH = [-0.015,-0.003,0.003,0.015];
const STATES = ["SBR","BER","NEU","BUL","SBL"];

function classify(r){
  if(r < TH[0]) return 0;
  if(r < TH[1]) return 1;
  if(r < TH[2]) return 2;
  if(r < TH[3]) return 3;
  return 4;
}

function buildMatrix(seq){
  let n=5;
  let m=Array.from({length:n},()=>Array(n).fill(0));

  for(let i=0;i<seq.length-1;i++)
    m[seq[i]][seq[i+1]]++;

  return m.map(r=>{
    let s=r.reduce((a,b)=>a+b,0);
    return s ? r.map(v=>v/s) : Array(n).fill(0.2);
  });
}

function monte(P, avg, state, days){
  let res=[];
  for(let i=0;i<1000;i++){
    let s=state, val=0;

    for(let d=0;d<days;d++){
      let r=Math.random(),acc=0;
      for(let j=0;j<5;j++){
        acc+=P[s][j];
        if(r<acc){ s=j; break; }
      }
      val+=avg[s];
    }
    res.push(val);
  }

  res.sort((a,b)=>a-b);
  return res[Math.floor(res.length*0.05)];
}

async function run(){
  const out=document.getElementById("out");
  const t=document.getElementById("ticker").value;

  out.innerHTML="⏳ Loading...";

  try{
    const res=await fetch("/api/data?t="+t);
    const close=await res.json();

    let ret=[];
    for(let i=1;i<close.length;i++){
      ret.push((close[i]-close[i-1])/close[i-1]);
    }

    const seq=ret.map(classify);
    const P=buildMatrix(seq);

    let avg=Array(5).fill(0);
    for(let i=0;i<5;i++){
      let vals=ret.filter((_,k)=>seq[k]===i);
      avg[i]=vals.reduce((a,b)=>a+b,0)/(vals.length||1);
    }

    const cur=seq[seq.length-1];

    let crash=ret.filter(r=>r<-0.02).length/ret.length;

    let signal =
      avg[cur]>0.001?"🟢 BUY":
      avg[cur]<-0.001?"🔴 SELL":
      "⚪ NEUTRAL";

    let mc30=monte(P,avg,cur,30);

    // graf
    let graph="<div style='display:flex'>";
    close.slice(-100).forEach(p=>{
      graph+=`<div class="bar" style="height:${p*0.4}px"></div>`;
    });
    graph+="</div>";

    // matrix
    let mhtml="<div class='grid'>";
    P.forEach(r=>{
      r.forEach(v=>{
        mhtml+=`<div class="cell" style="background:rgba(245,158,11,${v})">${(v*100).toFixed(0)}</div>`;
      });
    });
    mhtml+="</div>";

    out.innerHTML = `
      <h3>${signal} | STATE ${STATES[cur]}</h3>
      <p>Crash: ${(crash*100).toFixed(1)}%</p>
      <p>MC worst (30d): ${(mc30*100).toFixed(1)}%</p>
      ${graph}
      <h4>Transition Matrix</h4>
      ${mhtml}
    `;

  }catch(e){
    out.innerHTML="❌ error";
  }
}

</script>

</body>
</html>
