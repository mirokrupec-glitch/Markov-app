<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width">
<title>Markov Quant</title>

<style>
body { background:#0d1117; color:white; font-family:monospace; padding:15px; }
input,button { padding:10px; margin:5px; }
.grid { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; }
.cell { padding:6px; text-align:center; font-size:12px; }
.box { margin-top:10px; padding:10px; border:1px solid #333; }
.title { color:#f59e0b; }
.green { color:#22c55e; }
.red { color:#ef4444; }
canvas { width:100%; height:150px; background:#111; }
</style>

</head>

<body>

<h2>📊 MARKOV QUANT TERMINAL</h2>

<input id="ticker" value="AAPL">
<button onclick="run()">RUN</button>

<div id="out"></div>

<script>

const STATES = ["Strong Bear","Bear","Neutral","Bull","Strong Bull"];

function buildClassifier(ret){
  let sorted=[...ret].sort((a,b)=>a-b);
  let q15=sorted[Math.floor(sorted.length*0.15)];
  let q40=sorted[Math.floor(sorted.length*0.4)];
  let q60=sorted[Math.floor(sorted.length*0.6)];
  let q85=sorted[Math.floor(sorted.length*0.85)];

  return function(r){
    if(r<q15) return 0;
    if(r<q40) return 1;
    if(r<q60) return 2;
    if(r<q85) return 3;
    return 4;
  };
}

function buildMatrix(seq){
  let m=Array.from({length:5},()=>Array(5).fill(0));
  for(let i=0;i<seq.length-1;i++){
    m[seq[i]][seq[i+1]]++;
  }
  return m.map(r=>{
    let s=r.reduce((a,b)=>a+b,0);
    return s ? r.map(v=>v/s) : Array(5).fill(0.2);
  });
}

function monte(avg,vol,days){
  let r=[];
  for(let i=0;i<500;i++){
    let val=0;
    for(let d=0;d<days;d++){
      val += avg + vol*(Math.random()-0.5)*2;
    }
    r.push(val);
  }
  r.sort((a,b)=>a-b);
  return {
    worst:r[Math.floor(r.length*0.05)],
    median:r[Math.floor(r.length*0.5)],
    best:r[Math.floor(r.length*0.95)]
  };
}

// ✅ NOVÝ GRAF (line)
function drawChart(canvas, prices){

  let ctx = canvas.getContext("2d");

  let w = canvas.width = canvas.clientWidth;
  let h = canvas.height = canvas.clientHeight;

  ctx.clearRect(0,0,w,h);

  let min = Math.min(...prices);
  let max = Math.max(...prices);

  ctx.beginPath();
  ctx.strokeStyle = "#22c55e";
  ctx.lineWidth = 2;

  prices.forEach((p,i)=>{
    let x = i/(prices.length-1) * w;
    let y = h - ((p-min)/(max-min)) * h;

    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  });

  ctx.stroke();
}

async function run(){

  const t=document.getElementById("ticker").value;
  const out=document.getElementById("out");

  out.innerHTML="Loading...";

  try{
    const res=await fetch("/api/data?t="+t+"&_="+Date.now());
    const data=await res.json();

    const close=data.close;
    const name=data.name || t;
    const exchange=data.exchange || "unknown";

    let ret=[];
    for(let i=1;i<close.length;i++){
      if(close[i] && close[i-1]){
        ret.push((close[i]-close[i-1])/close[i-1]);
      }
    }

    const classify=buildClassifier(ret);
    const seq=ret.map(classify);
    const P=buildMatrix(seq);

    const current=seq[seq.length-1];

    let avg = ret.reduce((a,b)=>a+b,0)/ret.length;
    let vol = Math.sqrt(ret.reduce((a,b)=>a+b*b,0)/ret.length);

    let crash = ret.filter(x=>x<-0.02).length / ret.length;

    const mc30=monte(avg,vol,30);
    const mc90=monte(avg,vol,90);
    const mc252=monte(avg,vol,252);

    // SIGNAL
    let row=P[current];
    let down=row[0]+row[1];
    let up=row[3]+row[4];

    let signal="NEUTRAL";
    if(up>down && up>0.5) signal="BUY";
    if(down>up && down>0.5) signal="SELL";

    let confidence = Math.max(up,down);
    let strength = Math.abs(up-down);

    let winrate = (mc30.median > 0) ? up : (1-down);
    winrate *= 100;

    let signalHTML=signal;
    if(signal==="BUY") signalHTML=`<span class="green">BUY</span>`;
    if(signal==="SELL") signalHTML=`<span class="red">SELL</span>`;

    // matrix
    let matrixHTML="<div class='grid'>";
    P.forEach(r=>{
      r.forEach(v=>{
        matrixHTML+=`<div class="cell">${(v*100).toFixed(0)}%</div>`;
      });
    });
    matrixHTML+="</div>";

    out.innerHTML=`

      <div class="box">
        <div class="title">Company</div>
        ${name} (${t.toUpperCase()})<br>
        Exchange: ${exchange}
      </div>

      <div class="box">
        <div class="title">State</div>
        ${STATES[current]}
      </div>

      <div class="box">
        <div class="title">Trading Signal</div>
        ${signalHTML}
      </div>

      <div class="box">
        <div class="title">Confidence</div>
        ${(confidence*100).toFixed(1)}%
      </div>

      <div class="box">
        <div class="title">Trend Strength</div>
        ${(strength*100).toFixed(1)}%
      </div>

      <div class="box">
        <div class="title">Win Probability</div>
        ${winrate.toFixed(1)}%
      </div>

      <div class="box">
        <div class="title">Crash Risk</div>
        ${(crash*100).toFixed(1)}%
      </div>

      <div class="box">
        <div class="title">Monte Carlo</div>
        30d: ${mc30.worst.toFixed(2)} → ${mc30.median.toFixed(2)} → ${mc30.best.toFixed(2)}<br>
        90d: ${mc90.worst.toFixed(2)} → ${mc90.median.toFixed(2)} → ${mc90.best.toFixed(2)}<br>
        1y: ${mc252.worst.toFixed(2)} → ${mc252.median.toFixed(2)} → ${mc252.best.toFixed(2)}
      </div>

      <div class="box">
        ${matrixHTML}
      </div>

      <div class="box">
        <div class="title">Price Chart</div>
        <canvas id="chart"></canvas>
      </div>
    `;

    // ✅ vykresli graf
    setTimeout(()=>{
      drawChart(document.getElementById("chart"), close.slice(-100));
    },10);

  }
  catch(e){
    out.innerHTML="❌ error";
  }
}

</script>

</body>
</html>
