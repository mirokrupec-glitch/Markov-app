<h2>📊 MARKOV TERMINAL</h2>

<input id="ticker" value="AAPL">
<button id="runBtn">RUN</button>

<div id="out"></div>

<script>

// ✅ klik funguje vždy
document.getElementById("runBtn").addEventListener("click", run);

// ✅ správna funkcia s fallback proxy
async function fetchWithFallback(url) {
  const proxies = [
    u => "https://corsproxy.io/?" + encodeURIComponent(u),
    u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
    u => "https://thingproxy.freeboard.io/fetch/" + u
  ];

  for (let i = 0; i < proxies.length; i++) {
    try {
      const proxyUrl = proxies[i](url);   // ✅ OPRAVA TU
      const res = await fetch(proxyUrl);

      if (res.ok) {
        return await res.json();
      }
    } catch(e) {
      // skúsi ďalší proxy
    }
  }

  throw new Error("All proxies failed");
}

// ✅ hlavná funkcia
async function run() {
  const out = document.getElementById("out");
  const ticker = document.getElementById("ticker").value.toUpperCase();

  out.innerHTML = "⏳ Loading...";

  try {
    const url = "https://query1.finance.yahoo.com/v8/finance/chart/" + ticker;

    const data = await fetchWithFallback(url);

    if (!data.chart || !data.chart.result) {
      out.innerHTML = "❌ Zlý ticker alebo blokované";
      return;
    }

    const close = data.chart.result[0].indicators.quote[0].close;

      if (close[i] && close[i-1]) {
        returns.push((close[i] - close[i-1]) / close[i-1]);
      }
    }

    let avg = returns.reduce((a,b)=>a+b,0) / returns.length;
    let crash = returns.filter(r=>r < -0.02).length / returns.length
