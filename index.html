<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markov Quant</title>

<style>
body {
  background:#0d1117;
  color:white;
  font-family:monospace;
  padding:15px;
}
input,button {
  padding:10px;
  margin:5px;
}
.bar {
  width:2px;
  background:#22c55e;
}
</style>
</head>

<body>

<h2>📊 MARKOV TERMINAL (offline demo)</h2>

<input id="ticker" value="AAPL">
<button onclick="run()">RUN</button>

<div id="out"></div>

<script>

function generateMockData() {
  let prices = [100];

  for (let i = 0; i < 200; i++) {
    let last = prices[prices.length - 1];
    let change = (Math.random() - 0.5) * 2; // +-1%
    prices.push(last * (1 + change / 100));
  }

  return prices;
}

function run() {
  const out = document.getElementById("out");

  out.innerHTML = "⏳ Výpočty...";

  // ✅ namiesto API použijeme interné dáta
  const close = generateMockData();

  let returns = [];

  for (let i = 1; i < close.length; i++) {
    returns.push((close[i] - close[i-1]) / close[i-1]);
  }

  let avg = returns.reduce((a,b)=>a+b,0) / returns.length;
  let crash = returns.filter(r=>r < -0.02).length / returns.length;

  let signal =
    avg > 0.001 ? "🟢 BUY" :
    avg < -0.001 ? "🔴 SELL" :
    "⚪ NEUTRAL";

  let graph = "<div style='display:flex;gap:1px;margin-top:10px'>";
  close.slice(-100).forEach(p=>{
    graph += `<div class="bar" style="height:${p}px"></div>`;
  });
  graph += "</div>";

  out.innerHTML = `
    <h3>${signal}</h3>
    <p>Crash risk: ${(crash*100).toFixed(1)}%</p>
    ${graph}
  `;
}

</script>

</body>
</html>
